name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            workdir="$(mktemp -d)"
            for cmd in anac-pl-pp-cli anac-pl-pp-mcp; do
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
                -ldflags "-s -w -X anac-pl-pp-cli/internal/cliutil.Version=${VERSION}" \
                -o "$workdir/${cmd}${ext}" "./cmd/${cmd}"
            done
            cp README.md LICENSE NOTICE SKILL.md "$workdir/"
            name="anac-pl-pp-cli_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              (cd "$workdir" && zip -qr - .) > "dist/${name}.zip"
            else
              tar -czf "dist/${name}.tar.gz" -C "$workdir" .
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
